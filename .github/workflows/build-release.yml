name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode stable Android signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Configure RELEASE_KEYSTORE_BASE64 and the release key password/alias secrets before publishing an updatable APK."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zapdrop-release.jks"
          test -s "$RUNNER_TEMP/zapdrop-release.jks"

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build signed Android release APK
        working-directory: ./android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_BASE="${VERSION_NAME%%[-+]*}"
          if ! [[ "$VERSION_BASE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Release tags must use semantic versions, for example v1.0.1."
            exit 1
          fi
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION_BASE"
          VERSION_MINOR="${VERSION_MINOR:-0}"
          VERSION_PATCH="${VERSION_PATCH:-0}"
          VERSION_CODE=$((10#$VERSION_MAJOR * 1000000 + 10#$VERSION_MINOR * 1000 + 10#$VERSION_PATCH))
          if [ "$VERSION_CODE" -lt 1 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::This semantic version cannot be represented as a valid Android version code."
            exit 1
          fi
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD for the stable release keystore."
            exit 1
          fi
          export RELEASE_STORE_FILE="$RUNNER_TEMP/zapdrop-release.jks"
          ./gradlew assembleRelease --stacktrace \
            "-PAPP_VERSION_NAME=$VERSION_NAME" \
            "-PAPP_VERSION_CODE=$VERSION_CODE"

      - name: Prepare APK and SHA-256 checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/Zapdrop-${VERSION}-release.apk"
          cd artifacts
          sha256sum "Zapdrop-${VERSION}-release.apk" > "Zapdrop-${VERSION}-release.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zapdrop-${{ github.ref_name }}-android
          path: artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zapdrop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
